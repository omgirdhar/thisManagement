<!-- SUBTASKS -->
      <div class="mt-4">
        <div class="card mb-4">
			<div class="card-header bg-light fw-semibold d-flex justify-content-between align-items-center">
			    <span>Subtasks</span>

			    <button class="btn btn-sm btn-primary"
			            onclick="showCreateSubtaskRow()">
			        <i class="bi bi-plus"></i>
			        Create Subtask
			    </button>
			</div>
          <div class="card-body p-0">
            <table class="table table-hover mb-0">
				<thead class="table-light">
				<tr>
				    <th>Key</th>
				    <th>Summary</th>
				    <th>Assignee</th>
				    <th>Status</th>
				</tr>
				</thead>
              <tbody id="subtasks-tbody">
                <tr th:each="task : ${childTasks}">
                  <td >
					<a th:href="@{/projects/{projectId}/tasks/details/{taskId}(
					                          projectId=${project.id},
					                          taskId=${task.id})}"
					                       th:text="${project.alias + '-' + task.id}">
					                    </a>
				  </td>
				<td class="subtask-title-cell">		
					<!-- VIEW MODE -->
					<span th:id="'subtask-title-view-' + ${task.id}" style="cursor:pointer;" th:text="${task.title}"
						th:onclick="'enableSubtaskTitleEdit(' + ${task.id} + ')'">
					</span>
				
					<!-- EDIT MODE -->
					<input type="text" th:id="'subtask-title-edit-' + ${task.id}" class="form-control form-control-sm d-none"
						th:value="${task.title}" th:onblur="'handleSubtaskTitleBlur(' + ${task.id} + ')'"
						th:onkeydown="'handleSubtaskTitleKey(event,' + ${task.id} + ')'">
				</td>
				<td>
					<!-- VIEW MODE -->
					<div th:id="'subtask-assignee-view-' + ${task.id}" style="cursor:pointer;"
						th:onclick="'enableSubtaskAssigneeEdit(' + ${task.id} + ')'">
				
						<div class="avatar-circle"
					           th:if="${task.assignee != null}"
					           th:text="${#strings.substring(task.assignee.firstName,0,1) + #strings.substring(task.assignee.lastName,0,1)}">
					      </div>
						  <div class="avatar-circle" th:if="${task.assignee == null}">?</div>
						  
					</div>				
					<!-- EDIT MODE -->
					<select th:id="'subtask-assignee-edit-' + ${task.id}" class="form-select form-select-sm d-none"
						th:onchange="'updateSubtaskAssignee(' + ${task.id} + ', this.value)'">
				
						<option value="">Unassigned</option>
				
						<option th:each="user : ${projectUsers}" th:value="${user.userId}" th:text="${user.name}"
							th:selected="${task.assignee != null and task.assignee.id == user.userId}">
						</option>
				
					</select>
				
					</td>
				<td>				
					<!-- VIEW MODE -->
					<span th:id="'subtask-status-view-' + ${task.id}" class="badge bg-secondary" style="cursor:pointer;"
						th:text="${task.status}" th:onclick="'enableSubtaskStatusEdit(' + ${task.id} + ')'">
					</span>
				
					<!-- EDIT MODE -->
					<select th:id="'subtask-status-edit-' + ${task.id}" class="form-select form-select-sm d-none"
						th:onchange="'updateSubtaskStatus(' + ${task.id} + ', this.value)'">				
						<option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
							th:selected="${task.status == status}">
						</option>				
					</select>				
				</td>
                </tr>
				<tr id="create-subtask-row" class="d-none">
				    <td>NEW</td>

				    <td>
				        <input type="text"
				               id="new-subtask-title"
				               class="form-control form-control-sm"
				               placeholder="What needs to be done?"
				               onkeydown="handleCreateSubtask(event)">
				    </td>

				    <td colspan="2">
				        <div class="d-flex gap-2">
				            <button class="btn btn-success btn-sm"
				                    onclick="createSubtask()">
				                Create
				            </button>

				            <button class="btn btn-outline-secondary btn-sm"
				                    onclick="hideCreateSubtaskRow()">
				                Cancel
				            </button>
				        </div>
				    </td>
				</tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

<!-- KEY DETAILS - COLLAPSIBLE -->
<div class="accordion" id="keyDetailsAccordion">
	<div class="accordion-item">
		<h3 class="accordion-header">
			<button class="accordion-button fw-semibold" type="button" data-bs-toggle="collapse"
				data-bs-target="#keyDetailsCollapse" aria-expanded="true">
				Key Details
			</button>
		</h3>
		<div id="keyDetailsCollapse" class="accordion-collapse collapse show" data-bs-parent="#keyDetailsAccordion">
			<div class="accordion-body">

				<!-- DESCRIPTION -->
				<div class="mb-4">
					<h6 class="text-muted fw-semibold">Description</h6>

					<!-- VIEW MODE -->
					<div id="description-view" class="p-3 border rounded bg-white" style="cursor:pointer;"
						onclick="enableEdit()" th:text="${currentTask.description} ?: 'Click to add description...'">
					</div>

					<!-- EDIT MODE -->
					<div id="description-edit" class="d-none mt-2">
						<textarea id="description-textarea" class="form-control" rows="4"
							th:text="${currentTask?.description}">
                  </textarea>

						<div class="mt-2">
							<button class="btn btn-primary btn-sm" th:onclick="saveDescription([[${currentTask.id}]])">
								Save
							</button>
							<button class="btn btn-secondary btn-sm" onclick="cancelEdit()">
								Cancel
							</button>
						</div>
					</div>
				</div>

				<!-- META INFO GRID -->
				<div class="mt-3">

					<!-- Original Estimate -->
					<div class="d-flex py-2 align-items-center  border-bottom ">
						<div style="width: 200px;" class="text-muted">Original Estimate</div>

						<!-- VIEW MODE -->
						<div id="estimate-view" style="cursor:pointer;" onclick="enableEstimateEdit()">

							<span th:if="${currentTask.originalEstimateMinutes != null}" th:text="|${currentTask.originalEstimateMinutes / 60}h 
				                                   ${currentTask.originalEstimateMinutes % 60}m|">
							</span>

							<span th:if="${currentTask.originalEstimateMinutes == null}" class="text-muted">
								Set estimate
							</span>
						</div>

						<!-- EDIT MODE -->
						<div id="estimate-edit" class="d-none">

							<input type="text" id="estimate-input" class="form-control form-control-sm"
								placeholder="e.g. 2h 30m, 90m, 1.5h" th:value="${currentTask.originalEstimateMinutes != null ?
				                                     (currentTask.originalEstimateMinutes / 60) + 'h ' +
				                                     (currentTask.originalEstimateMinutes % 60) + 'm' : ''}"
								th:onchange="saveEstimate([[${currentTask.id}]])">
						</div>

					</div>

					<!-- Start Date -->
					<div class="d-flex py-2 border-bottom align-items-center">
						<div style="width: 200px;" class="text-muted">Start Date</div>

						<!-- VIEW MODE -->
						<div id="startDate-view" style="cursor:pointer;" onclick="enableStartDateEdit()">

							<span th:if="${currentTask.startDate != null}"
								th:text="${#temporals.format(currentTask.startDate, 'dd MMM yyyy')}">
							</span>

							<span th:if="${currentTask.startDate == null}" class="text-muted">
								Set start date
							</span>
						</div>

						<!-- EDIT MODE -->
						<div id="startDate-edit" class="d-none">

							<input type="date" id="startDate-input" class="form-control form-control-sm"
								th:value="${currentTask.startDate}" th:onchange="saveStartDate([[${currentTask.id}]])">
						</div>
					</div>

					<!-- Due Date -->
					<div class="d-flex py-2 border-bottom align-items-center">
						<div style="width: 200px;" class="text-muted">Due Date</div>

						<!-- VIEW MODE -->
						<div id="dueDate-view" style="cursor:pointer;" onclick="enableDueDateEdit()">

							<span th:if="${currentTask.dueDate != null}"
								th:text="${#temporals.format(currentTask.dueDate, 'dd MMM yyyy')}">
							</span>

							<span th:if="${currentTask.dueDate == null}" class="text-muted">
								Set due date
							</span>
						</div>

						<!-- EDIT MODE -->
						<div id="dueDate-edit" class="d-none">

							<input type="date" id="dueDate-input" class="form-control form-control-sm"
								th:value="${currentTask.dueDate}" th:onchange="saveDueDate([[${currentTask.id}]])">
						</div>
					</div>

					<!-- Priority -->
					<div class="d-flex py-2 align-items-center">
						<div style="width: 200px;" class="text-muted">Priority</div>

						<!-- VIEW MODE -->
						<div id="priority-view" style="cursor:pointer;" onclick="enablePriorityEdit()">

							<!-- If priority exists -->
							<span th:if="${currentTask.priority != null}" class="badge" th:classappend="${currentTask.priority.name() == 'HIGH'} ? 'bg-danger' :
				                                          (${currentTask.priority.name() == 'MEDIUM'} ? 'bg-warning text-dark' :
				                                          'bg-secondary')" th:text="${currentTask.priority}">
							</span>

							<!-- If priority is null -->
							<span th:if="${currentTask.priority == null}" class="text-muted">
								Select Priority
							</span>

						</div>

						<!-- EDIT MODE -->
						<div id="priority-edit" class="d-none">
							<select id="priority-select" class="form-select form-select-sm"
								th:onchange="savePriority([[${currentTask.id}]])">

								<option value="" th:selected="${currentTask.priority == null}">
									No Priority
								</option>
								<option value="HIGH" th:selected="${currentTask.priority?.name() == 'HIGH'}">High
								</option>
								<option value="MEDIUM" th:selected="${currentTask.priority?.name() == 'MEDIUM'}">Medium
								</option>
								<option value="LOW" th:selected="${currentTask.priority?.name() == 'LOW'}">Low</option>
							</select>
						</div>
					</div>

				</div>

			</div>
		</div>
	</div>
</div>

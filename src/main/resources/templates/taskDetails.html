<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Task | ' + ${currentTask.title}">Task Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/sidebar.css" rel="stylesheet">
  <link href="/css/subtask-table.css" rel="stylesheet">
  <link href="/css/avatar-circle.css" rel="stylesheet">
</head>
<style>
	.accordion-button{
		background-color: #fff !important;
	}
</style>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/commonNavbar}"></div>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div th:replace="~{fragments/commonSidebar}"></div>

    <!-- Main Content -->
<main class="col-lg-10 ms-auto p-4" style="background:#f4f5f7; min-height:100vh;">

  <div class="row">

    <!-- ========================= -->
    <!-- ======= MAIN AREA ======= -->
    <!-- ========================= -->
    <div class="col-lg-8">

      <!-- BREADCRUMB -->
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
          <li class="breadcrumb-item">
            <a th:href="@{/projects/{id}/tasks(id=${project.id})}"
               th:text="${project.name}">Project</a>
          </li>

          <li class="breadcrumb-item"
              th:if="${currentTask.parentTask != null}">
            <a th:href="@{/projects/{projectId}/tasks/details/{taskId}(
                projectId=${project.id},
                taskId=${currentTask.parentTask.id})}"
               th:text="${project.alias +'-' +currentTask.parentTask.id}">
            </a>
          </li>

          <li class="breadcrumb-item active"
              th:text="${project.alias +'-' +currentTask.id}">
          </li>
        </ol>
      </nav>

	<!-- TITLE -->
	<!-- VIEW MODE -->
	<h2 id="title-view" class="fw-bold mb-3" style="cursor:pointer;" onclick="enableTitleEditMain()"
		th:text="${currentTask.title}">
	</h2>
	
	<!-- EDIT MODE -->
	<input type="text" id="title-edit" class="form-control form-control-lg d-none mb-3" th:value="${currentTask.title}"
		onblur="handleTitleBlurMain()" onkeydown="handleTitleKeyMain(event)">

		<div th:replace="~{taskDetailSections/keyDetailSection}"></div>

      <div th:replace="~{taskDetailSections/subTaskTableSection}"></div>

	  <div th:replace="~{taskDetailSections/commentSection}"></div>

    </div>

    <!-- ========================= -->
    <!-- ===== RIGHT DRAWER ====== -->
    <!-- ========================= -->
    <div class="col-lg-4">
      <!-- Right drawer content remains exactly the same -->
      <div class="card mb-3">
        <div class="card-body">

          <!-- STATUS DROPDOWN (static for now) -->
		  <div class="mb-4">
		    <label class="fw-semibold mb-2">Status</label>

		    <div class="dropdown">

		      <button id="statusButton"
		              class="btn dropdown-toggle w-100"
		              type="button"
		              data-bs-toggle="dropdown"
		              th:classappend="${currentTask.status== 'DONE'} ? ' btn-success' :
		                              (${currentTask.status == 'IN_PROGRESS'} ? ' btn-primary' :
		                              ' btn-secondary')">

		        <span id="statusText"
		              th:text="${currentTask.status}">
		        </span>

		      </button>

		      <ul class="dropdown-menu w-100">
		        <li>
		          <a class="dropdown-item"
		             href="#"
		             onclick="updateStatus('TO_DO')">
		            To Do
		          </a>
		        </li>

		        <li>
		          <a class="dropdown-item"
		             href="#"
		             onclick="updateStatus('IN_PROGRESS')">
		            In Progress
		          </a>
		        </li>

		        <li>
		          <a class="dropdown-item"
		             href="#"
		             onclick="updateStatus('DONE')">
		            Done
		          </a>
		        </li>
		      </ul>

		    </div>
		  </div>

          <!-- DETAILS DROPDOWN -->
          <div class="accordion" id="detailsAccordion">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#detailsCollapse">
                  Details
                </button>
              </h2>
              <div id="detailsCollapse"
                   class="accordion-collapse collapse show"
                   data-bs-parent="#detailsAccordion">
                <div class="accordion-body small">

                  <p>
                    <strong>Assignee:</strong><br>
                    <span th:text="${currentTask.assignee != null 
                      ? currentTask.assignee.firstName + ' ' + currentTask.assignee.lastName 
                      : 'Unassigned'}">
                    </span>
                  </p>

                  <p>
                    <strong>Reporter:</strong><br>
					<span th:text="${currentTask.assignee != null 
					                      ? currentTask.assignee.firstName + ' ' + currentTask.assignee.lastName 
					                      : 'Unassigned'}">
					                    </span>
                  </p>

                  <p>
                    <strong>Time Tracking:</strong><br>
                    No time logged
                  </p>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

</main>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/authFetch.js"></script>
<script>
	function enableEdit() {
	  document.getElementById("description-view").classList.add("d-none");
	  document.getElementById("description-edit").classList.remove("d-none");
	}

	function cancelEdit() {
	  document.getElementById("description-edit").classList.add("d-none");
	  document.getElementById("description-view").classList.remove("d-none");
	}
	function enableCommentEdit(commentId) {
		  document.getElementById("comment-view-" + commentId)
		          .classList.add("d-none");
		  document.getElementById("comment-edit-" + commentId)
		          .classList.remove("d-none");
		}

	function cancelCommentEdit(commentId) {
	  document.getElementById("comment-edit-" + commentId)
	          .classList.add("d-none");
	  document.getElementById("comment-view-" + commentId)
	          .classList.remove("d-none");
	}
	function enablePriorityEdit() {
	  document.getElementById("priority-view").classList.add("d-none");
	  document.getElementById("priority-edit").classList.remove("d-none");
	}

	function enableDueDateEdit() {
	  document.getElementById("dueDate-view").classList.add("d-none");

	  const edit = document.getElementById("dueDate-edit");
	  edit.classList.remove("d-none");

	  const input = document.getElementById("dueDate-input");
	  input.focus();
	  if (input.showPicker) input.showPicker();
	}
	function enableStartDateEdit() {
	  document.getElementById("startDate-view").classList.add("d-none");

	  const edit = document.getElementById("startDate-edit");
	  edit.classList.remove("d-none");

	  const input = document.getElementById("startDate-input");
	  input.focus();
	  if (input.showPicker) input.showPicker();
	}
	function enableEstimateEdit() {
	  document.getElementById("estimate-view").classList.add("d-none");
	  document.getElementById("estimate-edit").classList.remove("d-none");
	}	
	
	document.addEventListener("click", function (event) {

	  function handleOutside(viewId, editId) {
	    const view = document.getElementById(viewId);
	    const edit = document.getElementById(editId);

	    if (!view || !edit) return;

	    if (!edit.classList.contains("d-none")) {
	      if (!edit.contains(event.target) &&
	          !view.contains(event.target)) {

	        edit.classList.add("d-none");
	        view.classList.remove("d-none");
	      }
	    }
	  }

	  handleOutside("priority-view", "priority-edit");
	  handleOutside("dueDate-view", "dueDate-edit");
	  handleOutside("startDate-view", "startDate-edit");
	  handleOutside("estimate-view", "estimate-edit");

	});
	

	function formatStatus(status) {
	  if (status === "IN_PROGRESS") return "In Progress";
	  if (status === "TO_DO") return "To Do";
	  if (status === "DONE") return "Done";
	  return status;
	}
	
	function saveDescription(taskId) {

	  const newDescription =
	      document.getElementById("description-textarea").value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      description: newDescription
	    })
	  })
	  .then(() => {
	    document.getElementById("description-view").innerText =
	        newDescription || "Click to add description...";

	    cancelEdit();
	  })
	  .catch(() => {
	    alert("Failed to update description");
	  });
	}
	
	function enableTitleEditMain() {
	  document.getElementById("title-view").classList.add("d-none");
	  const input = document.getElementById("title-edit");
	  input.classList.remove("d-none");
	  input.focus();
	  input.select();
	}

	function closeTitleEditMain() {
	  document.getElementById("title-edit").classList.add("d-none");
	  document.getElementById("title-view").classList.remove("d-none");
	}

	function handleTitleKeyMain(event) {
	  if (event.key === "Enter") updateTitleMain();
	  if (event.key === "Escape") closeTitleEditMain();
	}

	function handleTitleBlurMain() {

	  const input = document.getElementById("title-edit");
	  const newValue = input.value.trim();
	  const oldValue = document.getElementById("title-view").innerText;

	  if (!newValue || newValue === oldValue) {
		input.value = oldValue;
	    closeTitleEditMain();
	    return;
	  }

	  updateTitleMain();
	}
	
	function updateTitleMain() {
	  const input = document.getElementById("title-edit");
	  const newTitle = input.value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({ title: newTitle })
	  })
	  .then(() => {
	    document.getElementById("title-view").innerText = newTitle;
	    closeTitleEditMain();
	  })
	  .catch(() => {
	    alert("Failed to update title");
	  });
	}
	let activeSubtaskTitleEditor = null;

	function enableSubtaskTitleEdit(taskId) {

	  if (activeSubtaskTitleEditor && activeSubtaskTitleEditor !== taskId) {
	    closeSubtaskTitleEdit(activeSubtaskTitleEditor);
	  }

	  activeSubtaskTitleEditor = taskId;

	  const view = document.getElementById("subtask-title-view-" + taskId);
	  const input = document.getElementById("subtask-title-edit-" + taskId);

	  view.classList.add("d-none");
	  input.classList.remove("d-none");

	  input.focus();
	  input.select();
	}

	function closeSubtaskTitleEdit(taskId) {
	  const view = document.getElementById("subtask-title-view-" + taskId);
	  const input = document.getElementById("subtask-title-edit-" + taskId);

	  if (!view || !input) return;

	  input.classList.add("d-none");
	  view.classList.remove("d-none");

	  activeSubtaskTitleEditor = null;
	}

	function handleSubtaskTitleKey(event, taskId) {
	  if (event.key === "Enter") updateSubtaskTitle(taskId);
	  if (event.key === "Escape") closeSubtaskTitleEdit(taskId);
	}
	
	function handleSubtaskTitleBlur(taskId) {

	  const input = document.getElementById("subtask-title-edit-" + taskId);
	  const view = document.getElementById("subtask-title-view-" + taskId);

	  const newValue = input.value.trim();
	  const oldValue = view.innerText.trim();

	  if (!newValue || newValue === oldValue) {
	    input.value = oldValue;
	    closeSubtaskTitleEdit(taskId);
	    return;
	  }

	  updateSubtaskTitle(taskId);
	}

	function updateSubtaskTitle(taskId) {

	  const input = document.getElementById("subtask-title-edit-" + taskId);
	  const newTitle = input.value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({ title: newTitle })
	  })
	  .then(() => {

	    const view = document.getElementById("subtask-title-view-" + taskId);
	    view.innerText = newTitle;

	    closeSubtaskTitleEdit(taskId);

	  })
	  .catch(() => {
	    alert("Failed to update title");
	  });
	}
	document.addEventListener("click", function (event) {

	  if (!activeSubtaskTitleEditor) return;

	  const view = document.getElementById("subtask-title-view-" + activeSubtaskTitleEditor);
	  const input = document.getElementById("subtask-title-edit-" + activeSubtaskTitleEditor);

	  if (!view || !input) return;

	  if (!input.contains(event.target) && !view.contains(event.target)) {
	    closeSubtaskTitleEdit(activeSubtaskTitleEditor);
	  }
	});
</script>
<script th:inline="javascript">
  var taskId = /*[[${currentTask.id}]]*/ 0;
  var projectId = /*[[${project.id}]]*/ 0;
  var projectAlias = /*[[${project.alias}]]*/ '';
  
  function updateStatus(newStatus) {

    authFetch(`/task/${taskId}`, {
      method: "PATCH",
      body: JSON.stringify({
        status: newStatus
      })
    })
    .then(() => {

      const button = document.getElementById("statusButton");
      const text = document.getElementById("statusText");

      text.innerText = formatStatus(newStatus);

      button.classList.remove("btn-success", "btn-primary", "btn-secondary");

      if (newStatus === "DONE") {
        button.classList.add("btn-success");
      } else if (newStatus === "IN_PROGRESS") {
        button.classList.add("btn-primary");
      } else {
        button.classList.add("btn-secondary");
      }

    })
    .catch(() => {
      alert("Failed to update status");
    });
  }
</script>
<script>	
	function addComment(taskId) {

	  const content = document.getElementById("new-comment").value;

	  if (!content.trim()) {
	    alert("Comment cannot be empty");
	    return;
	  }

	  authFetch(`/comments/add/${taskId}`, {
	    method: "POST",
	    body: JSON.stringify({
	      content: content
	    })
	  })
	  .then(() => {
	    location.reload();
	  })
	  .catch(() => {
	    alert("Failed to add comment");
	  });
	}

	function saveComment(commentId) {

	  const content =
	      document.getElementById("comment-textarea-" + commentId).value;

	  authFetch(`/comments/update/${commentId}`, {
	    method: "PATCH",
	    body: JSON.stringify({ content: content })
	  })
	  .then(() => {
	    document.getElementById("comment-view-" + commentId).innerText = content;
	    cancelCommentEdit(commentId);
	  })
	  .catch(() => {
	    alert("Failed to update comment");
	  });
	}

	function deleteComment(commentId) {

	  authFetch(`/comments/delete/${commentId}`, {
	    method: "DELETE"
	  })
	  .then(() => {
	    document.getElementById("comment-view-" + commentId)
	            .parentElement.remove();
	  })
	  .catch(() => {
	    alert("Failed to delete comment");
	  });
	}

	function savePriority(taskId) {

	  const select = document.getElementById("priority-select");
	  const newPriority = select.value || null;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      priority: newPriority
	    })
	  })
	  .then(() => {

	    const view = document.getElementById("priority-view");

	    if (!newPriority) {
	      view.innerHTML = '<span class="text-muted">Select Priority</span>';
	    } else {

	      let badgeClass = "bg-secondary";

	      if (newPriority === "HIGH") {
	        badgeClass = "bg-danger";
	      } else if (newPriority === "MEDIUM") {
	        badgeClass = "bg-warning text-dark";
	      }

	      view.innerHTML =
	        `<span class="badge ${badgeClass}">
	            ${newPriority}
	         </span>`;
	    }

	    document.getElementById("priority-edit").classList.add("d-none");
	    view.classList.remove("d-none");

	  })
	  .catch(() => {
	    alert("Failed to update priority");
	  });
	}

	function saveDueDate(taskId) {

	  const newDate =
	      document.getElementById("dueDate-input").value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      dueDate: newDate || null
	    })
	  })
	  .then(() => {

	    const viewDiv = document.getElementById("dueDate-view");

	    if (newDate) {
	      viewDiv.innerText =
	          new Date(newDate).toLocaleDateString('en-GB', {
	            day: '2-digit',
	            month: 'short',
	            year: 'numeric'
	          });
	    } else {
	      viewDiv.innerHTML =
	          '<span class="text-muted">Set due date</span>';
	    }

	    document.getElementById("dueDate-edit").classList.add("d-none");
	    viewDiv.classList.remove("d-none");

	  })
	  .catch(() => {
	    alert("Failed to update due date");
	  });
	}
	
	function saveStartDate(taskId) {

	  const newDate =
	      document.getElementById("startDate-input").value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      startDate: newDate || null
	    })
	  })
	  .then(() => {

	    const viewDiv = document.getElementById("startDate-view");

	    if (newDate) {
	      viewDiv.innerText =
	          new Date(newDate).toLocaleDateString('en-GB', {
	            day: '2-digit',
	            month: 'short',
	            year: 'numeric'
	          });
	    } else {
	      viewDiv.innerHTML =
	          '<span class="text-muted">Set start date</span>';
	    }

	    document.getElementById("startDate-edit").classList.add("d-none");
	    viewDiv.classList.remove("d-none");

	  })
	  .catch(() => {
	    alert("Failed to update start date");
	  });
	}

	function saveEstimate(taskId) {

	  const value =
	      document.getElementById("estimate-input").value;

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      estimate: value || null
	    })
	  })
	  .then(() => {
	    location.reload();
	  })
	  .catch(() => {
	    alert("Invalid estimate format");
	  });
	}
	
</script>
<script>
	let activeSubtaskStatusEditor = null;

	function enableSubtaskStatusEdit(taskId) {

	  if (activeSubtaskStatusEditor && activeSubtaskStatusEditor !== taskId) {
	    closeSubtaskStatusEdit(activeSubtaskStatusEditor);
	  }

	  activeSubtaskStatusEditor = taskId;

	  document.getElementById("subtask-status-view-" + taskId)
	    .classList.add("d-none");

	  const select = document.getElementById("subtask-status-edit-" + taskId);
	  select.classList.remove("d-none");
	  select.focus();
	}

	function closeSubtaskStatusEdit(taskId) {

	  const view = document.getElementById("subtask-status-view-" + taskId);
	  const select = document.getElementById("subtask-status-edit-" + taskId);

	  if (!view || !select) return;

	  select.classList.add("d-none");
	  view.classList.remove("d-none");

	  activeSubtaskStatusEditor = null;
	}

	function updateSubtaskStatus(taskId, newStatus) {

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({ status: newStatus })
	  })
	  .then(() => {

	    const view = document.getElementById("subtask-status-view-" + taskId);

	    view.innerText = newStatus;

	    view.classList.remove("bg-success", "bg-primary", "bg-secondary");

	    if (newStatus === "COMPLETED" || newStatus === "DONE") {
	      view.classList.add("badge", "bg-success");
	    } else if (newStatus === "IN_PROGRESS") {
	      view.classList.add("badge", "bg-primary");
	    } else {
	      view.classList.add("badge", "bg-secondary");
	    }

	    closeSubtaskStatusEdit(taskId);

	  })
	  .catch(() => {
	    alert("Failed to update status");
	  });
	}
</script>
<script>
	let activeSubtaskAssigneeEditor = null;

	function enableSubtaskAssigneeEdit(taskId) {

	  if (activeSubtaskAssigneeEditor && activeSubtaskAssigneeEditor !== taskId) {
	    closeSubtaskAssigneeEdit(activeSubtaskAssigneeEditor);
	  }

	  activeSubtaskAssigneeEditor = taskId;

	  document.getElementById("subtask-assignee-view-" + taskId)
	    .classList.add("d-none");

	  const select = document.getElementById("subtask-assignee-edit-" + taskId);
	  select.classList.remove("d-none");
	  select.focus();
	}

	function closeSubtaskAssigneeEdit(taskId) {

	  const view = document.getElementById("subtask-assignee-view-" + taskId);
	  const select = document.getElementById("subtask-assignee-edit-" + taskId);

	  if (!view || !select) return;

	  select.classList.add("d-none");
	  view.classList.remove("d-none");

	  activeSubtaskAssigneeEditor = null;
	}

	function updateSubtaskAssignee(taskId, userId) {

	  authFetch(`/task/${taskId}`, {
	    method: "PATCH",
	    body: JSON.stringify({
	      assigneeId: userId || null
	    })
	  })
	  .then(() => {
	    location.reload(); // simplest (same as your main page)
	  })
	  .catch(() => {
	    alert("Failed to update assignee");
	  });
	}
</script>
<script>
	document.addEventListener("click", function (event) {

	  // STATUS
	  if (activeSubtaskStatusEditor) {
	    const view = document.getElementById("subtask-status-view-" + activeSubtaskStatusEditor);
	    const select = document.getElementById("subtask-status-edit-" + activeSubtaskStatusEditor);

	    if (view && select &&
	        !select.contains(event.target) &&
	        !view.contains(event.target)) {
	      closeSubtaskStatusEdit(activeSubtaskStatusEditor);
	    }
	  }

	  // ASSIGNEE
	  if (activeSubtaskAssigneeEditor) {
	    const view = document.getElementById("subtask-assignee-view-" + activeSubtaskAssigneeEditor);
	    const select = document.getElementById("subtask-assignee-edit-" + activeSubtaskAssigneeEditor);

	    if (view && select &&
	        !select.contains(event.target) &&
	        !view.contains(event.target)) {
	      closeSubtaskAssigneeEdit(activeSubtaskAssigneeEditor);
	    }
	  }

	});
</script>
<script>
	function showCreateSubtaskRow() {

	    document
	        .getElementById("create-subtask-row")
	        .classList.remove("d-none");

	    document
	        .getElementById("new-subtask-title")
	        .focus();
	}

	function hideCreateSubtaskRow() {

	    document
	        .getElementById("create-subtask-row")
	        .classList.add("d-none");

	    document
	        .getElementById("new-subtask-title")
	        .value = "";
	}

	function handleCreateSubtask(event) {

	    if(event.key === "Enter") {
	        createSubtask();
	    }

	    if(event.key === "Escape") {
	        hideCreateSubtaskRow();
	    }
	}
	function createSubtask() {

	    const title =
	        document.getElementById("new-subtask-title")
	                .value
	                .trim();

	    if(!title) return;

		authFetch(`/projects/${projectId}/tasks/${taskId}/subtasks`, {
		    method: "POST",
		    body: JSON.stringify({
		        title: title
		    })
		})
		.then(subtask => {

		    appendSubtaskRow(subtask);

		    hideCreateSubtaskRow();
		})
		.catch(error => {
		    console.error(error);
		    alert("Failed to create subtask");
		});
	}
	function appendSubtaskRow(subtask) {

	    const tbody =
	        document.getElementById("subtasks-tbody");

	    const row = document.createElement("tr");

	    row.innerHTML = `
	        <td>
	            <a href="/projects/${projectId}/tasks/details/${subtask.id}">
	                 ${projectAlias}-${subtask.id}
	            </a>
	        </td>

	        <td class="subtask-title-cell">
	            ${subtask.title}
	        </td>

	        <td>
	            Unassigned
	        </td>

	        <td>
	            <span class="badge bg-secondary">
	                ${subtask.status}
	            </span>
	        </td>
	    `;

	    tbody.appendChild(row);
	}
</script>
	
</body>
</html>
